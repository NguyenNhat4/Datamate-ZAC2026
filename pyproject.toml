[project]
name = "tabular-analysis-agent"
version = "0.1.0"
description = "Vietnamese tabular analysis with native code actions and isolated execution"
requires-python = ">=3.12,<3.13"
dependencies = [
    "smolagents[openai,telemetry]==1.26.0",
    "pandas==2.3.3",
    "openpyxl==3.1.5",
    "pydantic>=2.12,<3",
    "openai==1.109.1",
    "httpx==0.28.1",
    "streamlit==1.66.1",
    "graphql-core>=3.2,<3.3",
    "arize-phoenix==14.6.0",
    "python-dotenv>=1.0,<2",
    "duckdb==2.0.0",
    "pandera[pandas]==0.34.1",
]

[tool.uv]
package = false
